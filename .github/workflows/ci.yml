name: Public Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Public test workflow only. Never supply Salesforce secrets or workshop PDFs.
permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests with synthetic PDF fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install free PDF test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Public tracked-file safety gate
        run: python -m workshop_validator.public_safety
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q workshop_validator tests

  browser-smoke:
    name: Synthetic Chromium + evidence-gate smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install free synthetic test dependencies
        run: python -m pip install --requirement requirements-dev.txt playwright==1.57.0
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run synthetic browser smoke
        env:
          RUN_BROWSER_SMOKE: '1'
        run: |
          python -m unittest discover -s tests -p test_browser_worker.py -v
          python -m unittest discover -s tests -p test_pipeline.py -v
          python -m unittest discover -s tests -p test_discovery.py -v
          python -m unittest discover -s tests -p test_necessity_browser.py -v
