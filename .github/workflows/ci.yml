name: Public Python CI

on:
  push:
    branches: [main, 'automation/**']
  pull_request:
  workflow_dispatch:

# Public test workflow only. Never supply Salesforce secrets or workshop PDFs.
permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests with synthetic PDF fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install free PDF test dependencies
        run: python -m pip install --requirement requirements-dev.txt playwright==1.57.0
      - name: Public tracked-file safety gate
        run: python -m workshop_validator.public_safety
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q workshop_validator tests

  team-gates:
    name: Secrets scan and team gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Check out public source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets scan (gitleaks, free for personal accounts)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: No em dashes added, no decision rows removed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m workshop_validator.team_gates all --base "origin/$BASE_REF"

  browser-smoke:
    name: Synthetic Chromium + evidence-gate smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install free synthetic test dependencies
        run: python -m pip install --requirement requirements-dev.txt playwright==1.57.0
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run synthetic browser smoke
        env:
          RUN_BROWSER_SMOKE: '1'
        run: |
          python -m unittest discover -s tests -p test_browser_worker.py -v
          python -m unittest discover -s tests -p test_pipeline.py -v
          python -m unittest discover -s tests -p test_discovery.py -v
          python -m unittest discover -s tests -p test_necessity_browser.py -v
          python -m unittest discover -s tests -p test_private_runner.py -v
