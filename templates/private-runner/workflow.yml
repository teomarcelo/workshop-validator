name: PRIVATE pilot workshop guide validation

# TEMPLATE: COPY ONLY INTO AN APPROVED *PRIVATE* REPOSITORY.
# Never put private artifacts, org credentials or real PDFs in public CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-disposable-org-pilot
  cancel-in-progress: false

jobs:
  validate:
    name: Private disposable-org validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sandbox-trial-org
    steps:
      - name: Check out pinned public validator source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: teomarcelo/workshop-validator
          ref: ${{ vars.VALIDATOR_SHA }}
          path: validator
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install free validator dependencies
        working-directory: validator
        run: python -m pip install -r requirements-dev.txt playwright==1.57.0

      - name: Install Chromium
        working-directory: validator
        run: python -m playwright install --with-deps chromium

      - name: Load private approved guide, plan and source review
        working-directory: validator
        env:
          PRIVATE_STORAGE_HOST: ${{ vars.PRIVATE_STORAGE_HOST }}
          PRIVATE_GUIDE_URL: ${{ secrets.PRIVATE_GUIDE_URL }}
          PRIVATE_PLAN_URL: ${{ secrets.PRIVATE_PLAN_URL }}
          PRIVATE_REVIEW_URL: ${{ secrets.PRIVATE_REVIEW_URL }}
          PRIVATE_CONTENT_BEARER_TOKEN: ${{ secrets.PRIVATE_CONTENT_BEARER_TOKEN }}
        run: python -m workshop_validator.private_download --dir "$RUNNER_TEMP/wv-input"

      - name: Run private Salesforce guide validation
        working-directory: validator
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wv-results"
          if [ -f "$RUNNER_TEMP/wv-input/review.json" ]; then
            python -m workshop_validator.private_runner \
              --guide "$RUNNER_TEMP/wv-input/guide.pdf" \
              --plan "$RUNNER_TEMP/wv-input/plan.json" \
              --review "$RUNNER_TEMP/wv-input/review.json" \
              --output "$RUNNER_TEMP/wv-results"
          else
            python -m workshop_validator.private_runner \
              --guide "$RUNNER_TEMP/wv-input/guide.pdf" \
              --plan "$RUNNER_TEMP/wv-input/plan.json" \
              --output "$RUNNER_TEMP/wv-results"
          fi

      - name: Upload PRIVATE review artifacts only after explicit approval
        if: ${{ always() && vars.PRIVATE_ARTIFACT_UPLOAD_APPROVED == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-workshop-review
          path: ${{ runner.temp }}/wv-results/
          retention-days: 7
          if-no-files-found: warn
